# Reviewed updates only; no automated merging or production deployment.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/core/runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
