name: Account generated JavaScript and browser regression
on:
  push:
    branches: [main]
    paths: ["assets/legal-consent.js", "index.html", "core/runtime/**", ".github/workflows/account-browser-regression.yml"]
  pull_request:
    paths: ["assets/legal-consent.js", "index.html", "core/runtime/**", ".github/workflows/account-browser-regression.yml"]
permissions:
  contents: read
jobs:
  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: core/runtime
      - run: bun test tests/account-bootstrap-forensic.test.ts tests/request-panel-ui.test.ts tests/panel-client-polish.test.ts tests/commercial-entry.test.ts tests/payment-policy.test.ts
        working-directory: core/runtime
      - run: bun core/runtime/scripts/generate-account-browser-fixtures.ts
      - run: npm install --prefix /tmp/ad507-browser playwright@1.62.1
      - run: /tmp/ad507-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node core/runtime/tests/account-browser-regression.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/ad507-browser/node_modules/playwright
      - run: node scripts/check-historical-viewer.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/ad507-browser/node_modules/playwright
