name: Generate AD507 pages + sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
  run: sudo apt-get update && sudo apt-get install -y jq curl

- name: Fetch codes from WebApp
  run: |
    curl -s "${{ secrets.WEBAPP_URL }}?action=list" > codes.json
    cat codes.json | head

- name: Generate pages
  run: |
    mkdir -p out
    TEMPLATE=$(cat ad507.html)

    # leer códigos
    CODES=$(jq -r '.codes[]' codes.json)

    for CODE in $CODES; do

      SLUG=$(echo "$CODE" | tr '[:upper:]' '[:lower:]')
      DIR="out/$SLUG"

      mkdir -p "$DIR"

      echo "$TEMPLATE" | sed "s/AD507-CODE/$CODE/g" > "$DIR/index.html"

    done

            TITLE="$CODE | Dirección Digital Panamá | Direcciones507"
            DESC="Ubicación digital $CODE en Panamá. Abre en Google Maps, Waze o Uber."
            CANONICAL="https://direcciones507.com/$SLUG/"
            TARGET="https://direcciones507.com/?code=$CODE"

            PAGE="${TEMPLATE//\{\{TITLE\}\}/$TITLE}"
            PAGE="${PAGE//\{\{DESC\}\}/$DESC}"
            PAGE="${PAGE//\{\{CANONICAL\}\}/$CANONICAL}"
            PAGE="${PAGE//\{\{TARGET\}\}/$TARGET}"
            PAGE="${PAGE//\{\{CODE\}\}/$CODE}"

            echo "$PAGE" > "$DIR/index.html"
          done

      - name: Generate sitemap.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          for d in ad507-*/ ; do
            URL="https://direcciones507.com${d}"
            echo "  <url><loc>${URL}</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: Commit changes
        run: |
          git config user.name "direcciones507-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sitemap.xml ad507-* || true
          git commit -m "Auto-generate AD507 pages + sitemap" || echo "No changes"
          git push
