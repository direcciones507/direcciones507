name: Generate AD507 pages + sitemap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Fetch codes from WebApp
        run: |
          curl -s "${{ secrets.WEBAPP_URL }}?action=list" > codes.json
          cat codes.json | head

      - name: Generate pages
        run: |
          mkdir -p out

          CODES=$(jq -r '.codes[]' codes.json)

          for CODE in $CODES; do
            SLUG=$(echo "$CODE" | tr '[:upper:]' '[:lower:]')
            DIR="out/$SLUG"

            mkdir -p "$DIR"

            cp ad507.template.html "$DIR/index.html"
            sed -i "s/AD507-CODE/$CODE/g" "$DIR/index.html"
          done

      - name: Generate sitemap.xml
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://direcciones507.com/</loc></url>'

            for DIR in out/*; do
              if [ -d "$DIR" ]; then
                SLUG=$(basename "$DIR")
                echo "  <url><loc>https://direcciones507.com/$SLUG</loc></url>"
              fi
            done

            echo '</urlset>'
          } > out/sitemap.xml

      - name: Copy generated files to root
        run: |
          cp -r out/* .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate AD507 pages + sitemap"
            git push
          fi
