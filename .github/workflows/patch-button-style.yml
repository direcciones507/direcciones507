name: Unificar estilo botones principales

on:
  push:
    paths:
      - '.github/workflows/patch-button-style.yml'

permissions:
  contents: write

jobs:
  patch-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar degradado a botones principales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_free = ".free-address-btn { display: flex; align-items: center; justify-content: center; gap: 9px; background: transparent; border: 2px solid var(--cyan-brand); color: #fff; padding: 14px 12px; border-radius: 100px; font-weight: 800; text-decoration: none; font-size: 12px; text-transform: uppercase; cursor: pointer; text-align: center; }\n    .free-address-btn:hover { background: rgba(6, 182, 212, 0.1); transform: translateY(-2px); }"
          new_free = ".free-address-btn { display: flex; align-items: center; justify-content: center; gap: 9px; background: linear-gradient(135deg, #0891b2, #2563eb); border: none; color: #fff; padding: 14px 12px; border-radius: 12px; font-weight: 800; text-decoration: none; font-size: 12px; text-transform: uppercase; cursor: pointer; text-align: center; box-shadow: 0 12px 30px rgba(6, 182, 212, 0.25); }\n    .free-address-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(6, 182, 212, 0.35); filter: brightness(1.05); }"

          old_plan = ".btn-plan-action-trigger { display: block; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--cyan-brand); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; }"
          new_plan = ".btn-plan-action-trigger { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #0891b2, #2563eb); color: #fff; text-decoration: none; font-weight: 800; font-size: 13px; box-shadow: 0 12px 30px rgba(6, 182, 212, 0.25); cursor: pointer; }\n    .btn-plan-action-trigger:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(6, 182, 212, 0.35); filter: brightness(1.05); }"

          if old_free not in s:
              raise SystemExit('No se encontro estilo actual de free-address-btn')
          if old_plan not in s:
              raise SystemExit('No se encontro estilo actual de btn-plan-action-trigger')

          s = s.replace(old_free, new_free, 1)
          s = s.replace(old_plan, new_plan, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar que enlaces y guia sigan intactos
        shell: bash
        run: |
          grep -q 'linear-gradient(135deg, #0891b2, #2563eb)' index.html
          grep -q 'class="free-address-btn"' index.html
          grep -q 'class="btn-plan-action-trigger"' index.html
          grep -q 'class="free-address-info-btn"' index.html
          grep -q 'https://wa.me/50765996532?text=Hola,%20deseo%20solicitar%20mi%20direcci%C3%B3n%20digital%20gratis' index.html
          grep -q 'https://docs.google.com/forms/d/e/1FAIpQLSdvSoj6BViYQj71797pNJw1c6H28dsJZ5oiu86qQmou6Jxmng/viewform' index.html
          grep -q 'Plan%20Residencial%20Privado' index.html
          grep -q 'Plan%20Negocio%20Gratis' index.html
          grep -q 'Plan%20Negocio%20Premium' index.html
          grep -q 'Plan%20Premium%20Pro' index.html

      - name: Publicar cambio de estilos
        shell: bash
        run: |
          git config user.name 'direcciones507'
          git config user.email 'ventas@direcciones507.com'
          git add index.html
          git commit -m 'Unificar botones con degradado celeste azul'
          git push origin HEAD:main

# activado
