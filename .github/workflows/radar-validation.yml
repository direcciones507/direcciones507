name: Radar validation
on:
  push:
    branches: ["feature/radar-en-vivo"]
  pull_request:
    paths: ["core/runtime/radar/**", "core/runtime/tests/radar-*.test.ts", "core/runtime/tests/radar-*.mjs", ".github/workflows/radar-validation.yml"]
permissions:
  contents: read
jobs:
  radar-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install shared CORE dependencies
        working-directory: core/runtime
        run: bun install --frozen-lockfile
      - name: Run Radar unit tests
        working-directory: core/runtime
        run: bun test tests/radar-*.test.ts
  radar-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reuse shared browser dependencies
        working-directory: core/runtime
        run: bun install --frozen-lockfile
      - name: Validate Radar using the runner's existing Chrome
        run: node core/runtime/tests/radar-browser-regression.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/core/runtime/node_modules/playwright
          RADAR_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-focused-review
          path: /tmp/radar-review
          if-no-files-found: ignore
  radar-community-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install shared browser dependencies
        working-directory: core/runtime
        run: bun install --frozen-lockfile
      - name: Validate new Radar flows in isolated browser
        run: node core/runtime/tests/radar-community-browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/core/runtime/node_modules/playwright
          RADAR_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-community-review
          path: /tmp/radar-new-features
          if-no-files-found: ignore
  radar-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema and constraints
        run: |
          docker run --name radar-db -d -e POSTGRES_PASSWORD=test-only postgres:18.1
          for i in $(seq 1 30); do
            if docker exec radar-db pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/schema.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
          VALUES ('test-account','Test','shop','PA',8,-80);
          INSERT INTO radar.activity_reports(establishment_id,account_ref,state)
          SELECT id,'test-account','available' FROM radar.establishments;
          DO $radar_test$
          BEGIN
            IF (SELECT count(*) FROM radar.establishments WHERE NOT published) <> 1 THEN
              RAISE EXCEPTION 'Unexpected publication default';
            END IF;
            BEGIN
              INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
              VALUES ('test','Invalid','shop','PA',99,-80);
              RAISE EXCEPTION 'Invalid coordinate accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $radar_test$;
          SQL
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Exercise repository against PostgreSQL
        working-directory: core/runtime
        run: |
          export RADAR_TEST_DB="postgres://postgres:test-only@$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' radar-db):5432/postgres"
          bun -e '
            import { SQL } from "bun";
            import { createRadarRepository } from "./radar/repository";
            import { createModerationStore } from "./radar/moderation-repository";
            const db = new SQL(process.env.RADAR_TEST_DB);
            try {
              await db.unsafe("UPDATE radar.establishments SET published=true");
              const repo = createRadarRepository(db);
              const draft={name:"New shop",category:"shop",country:"PA",latitude:8.1,longitude:-80.1};
              const created=await repo.register(draft,"test-account");
              if(!created) throw Error("Registration failed");
              if(await repo.register({...draft,name:" NEW SHOP "},"another-account")) throw Error("Duplicate accepted");
              const fresh=await repo.findPublished(created);
              if(!fresh || fresh.verifiedOwnerAccount!==null) throw Error("Automatic publication or ownership isolation failed");
              const rows = await repo.listPublished("PA",{west:-83,south:7,east:-77,north:10});
              const existing=rows.find(row=>row.id!==created);
              if(rows.length!==2 || !rows.some(row=>row.id===created && row.reports.length===0) || !existing || existing.reports.length!==1) throw Error("Map query failed");
              if(!(await repo.findPublished(existing.id))) throw Error("Lookup failed");
              await repo.addReport(existing.id,"test-account","queue","community");
              const updated=await repo.listPublished("PA",{west:-83,south:7,east:-77,north:10});
              if(updated.find(row=>row.id===existing.id)?.reports.length!==2) throw Error("Report persistence failed");
              const moderation=createModerationStore(db);
              if((await moderation.pending(100)).some(row=>row.id===created)) throw Error("Automatic publication still pending");
              if(await moderation.publish(created)) throw Error("Repeated approval accepted");
              const legacy=await db.unsafe("INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude,published) VALUES ($1,$2,$3,$4,$5,$6,false) RETURNING id",["test-account","Legacy pending","services","PA",8.2,-80.2]);
              const legacyId=legacy[0].id;
              if(await repo.findPublished(legacyId)) throw Error("Legacy pending record leaked");
              if(!(await moderation.pending(100)).some(row=>row.id===legacyId)) throw Error("Legacy moderation queue failed");
              if(!(await moderation.publish(legacyId))) throw Error("Legacy moderation failed");
              if(await moderation.publish(legacyId)) throw Error("Repeated legacy approval accepted");
              if(!(await repo.findPublished(legacyId))) throw Error("Legacy publication failed");
              if(!(await repo.findPublished(created))) throw Error("Published establishment unavailable");
              if((await moderation.pending(100)).length!==0) throw Error("Published item still pending");
              const bounds={west:-83,south:7,east:-77,north:10};
              const matches=await repo.listPublished("PA",bounds,"NEW SHOP");
              if(matches.length!==1 || matches[0].id!==created) throw Error("Name search failed");
              if((await repo.listPublished("PA",bounds,"SHOP")).length!==2) throw Error("Category search failed");
              if((await repo.listPublished("PA",bounds,"%")).length!==0) throw Error("Wildcard interpreted");
              if((await repo.listPublished("CO",bounds,"shop")).length!==0) throw Error("Country filter lost");
              if((await repo.listPublished("PA",{west:-79,south:7,east:-77,north:10},"shop")).length!==0) throw Error("Bounds filter lost");
            } finally { await db.close(); }
          '
      - name: Validate shared account foreign keys
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA ad507;
          CREATE TABLE ad507.users(id uuid PRIMARY KEY);
          INSERT INTO ad507.users VALUES ('00000000-0000-4000-8000-000000000001');
          UPDATE radar.establishments SET account_ref='00000000-0000-4000-8000-000000000001';
          UPDATE radar.activity_reports SET account_ref='00000000-0000-4000-8000-000000000001';
          SQL
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/core-constraints.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $radar_test$
          BEGIN
            BEGIN
              INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
              VALUES ('00000000-0000-4000-8000-000000000002','Orphan','shop','PA',8,-80);
              RAISE EXCEPTION 'Orphan account accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,account_ref,state)
              SELECT id,'00000000-0000-4000-8000-000000000002','available' FROM radar.establishments LIMIT 1;
              RAISE EXCEPTION 'Orphan reporter accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN
              DELETE FROM ad507.users WHERE id='00000000-0000-4000-8000-000000000001';
              RAISE EXCEPTION 'Account deletion removed public establishments';
            EXCEPTION WHEN restrict_violation OR foreign_key_violation THEN NULL;
            END;
            IF NOT EXISTS (SELECT 1 FROM radar.establishments) THEN RAISE EXCEPTION 'Existing records lost'; END IF;
          END $radar_test$;
          SQL
      - name: Validate verified ownership schema
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/ownership.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO radar.verified_owners(establishment_id,account_ref,verified_by)
          SELECT id,'00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000001'
          FROM radar.establishments LIMIT 1;
          DO $ownership_test$
          BEGIN
            IF (SELECT count(*) FROM radar.verified_owners) <> 1 THEN RAISE EXCEPTION 'Ownership missing'; END IF;
            BEGIN
              INSERT INTO radar.verified_owners(establishment_id,account_ref)
              SELECT establishment_id,account_ref FROM radar.verified_owners;
              RAISE EXCEPTION 'Duplicate ownership accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $ownership_test$;
          SQL
      - name: Exercise verified ownership repository
        working-directory: core/runtime
        run: |
          export RADAR_TEST_DB="postgres://postgres:test-only@$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' radar-db):5432/postgres"
          bun -e '
            import { SQL } from "bun";
            import { createModerationStore } from "./radar/moderation-repository";
            const db=new SQL(process.env.RADAR_TEST_DB);
            try {
              const account="00000000-0000-4000-8000-000000000001";
              const rows=await db.unsafe("SELECT e.id FROM radar.establishments e WHERE e.published AND NOT EXISTS (SELECT 1 FROM radar.verified_owners o WHERE o.establishment_id=e.id)");
              if(rows.length!==1) throw Error("Expected one unclaimed establishment");
              const store=createModerationStore(db);
              if(!await store.verifyOwner(rows[0].id,account,account)) throw Error("Verification failed");
              if(await store.verifyOwner(rows[0].id,account,account)) throw Error("Duplicate verification accepted");
              const {createRadarRepository}=await import("./radar/repository");
              const repo=createRadarRepository(db,true);
              const id=rows[0].id;
              if((await repo.findPublished(id))?.verifiedOwnerAccount!==account) throw Error("Owner lookup failed");
              await repo.addReport(id,account,"available","verified_owner");
              const reports=await db.unsafe("SELECT source FROM radar.activity_reports WHERE establishment_id=$1",[id]);
              if(!reports.some(r=>r.source==="verified_owner")) throw Error("Verified report missing");
              let rejected=false;
              try { await repo.addReport(id,"00000000-0000-4000-8000-000000000099","available","verified_owner"); } catch { rejected=true; }
              if(!rejected) throw Error("Unverified account accepted");
            } finally { await db.close(); }
          '
      - name: Validate database abuse enforcement
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/abuse-constraints.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $radar_test$
          DECLARE target uuid; actor uuid := '00000000-0000-4000-8000-000000000001';
          BEGIN
            SELECT establishment_id INTO target FROM radar.activity_reports WHERE account_ref=actor AND source='verified_owner' LIMIT 1;
            IF target IS NULL THEN RAISE EXCEPTION 'Missing report fixture'; END IF;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,account_ref,state) VALUES(target,actor,'available');
              RAISE EXCEPTION 'Repeated report accepted';
            EXCEPTION WHEN SQLSTATE 'P4290' THEN NULL;
            END;
          END;
          $radar_test$;
          SQL
      - name: Verify concurrent report limit
        working-directory: core/runtime
        run: |
          export RADAR_TEST_DB="postgres://postgres:test-only@$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' radar-db):5432/postgres"
          bun -e '
            import { SQL } from "bun";
            const db=new SQL(process.env.RADAR_TEST_DB);
            try {
              const account="00000000-0000-4000-8000-000000000001";
              const [row]=await db.unsafe("SELECT establishment_id FROM radar.activity_reports WHERE source=$1 LIMIT 1",["verified_owner"]);
              await db.unsafe("DELETE FROM radar.activity_reports WHERE account_ref=$1",[account]);
              const results=await Promise.allSettled(Array.from({length:8},()=>db.unsafe("INSERT INTO radar.activity_reports(establishment_id,account_ref,state) VALUES($1,$2,$3)",[row.establishment_id,account,"available"])));
              if(results.filter(r=>r.status==="fulfilled").length!==1)throw Error("Concurrent report limit failed");
              const [count]=await db.unsafe("SELECT count(*)::int AS total FROM radar.activity_reports WHERE account_ref=$1",[account]);
              if(Number(count.total)!==1)throw Error("Unexpected persisted report count");
            } finally { await db.close(); }
          '
      - name: Verify account deletion preserves establishments
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/account-retention.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $radar_test$
          DECLARE actor uuid := '00000000-0000-4000-8000-000000000001'; target uuid;
          BEGIN
            SELECT id INTO target FROM radar.establishments WHERE account_ref=actor AND published LIMIT 1;
            IF target IS NULL THEN RAISE EXCEPTION 'Missing establishment fixture'; END IF;
            DELETE FROM ad507.users WHERE id=actor;
            IF NOT EXISTS (SELECT 1 FROM radar.establishments WHERE id=target AND account_ref IS NULL AND published) THEN RAISE EXCEPTION 'Establishment lost'; END IF;
            IF EXISTS (SELECT 1 FROM radar.verified_owners WHERE account_ref=actor) OR EXISTS (SELECT 1 FROM radar.activity_reports WHERE account_ref=actor) THEN RAISE EXCEPTION 'Deleted identity retained'; END IF;
          END;
          $radar_test$;
          SQL
      - name: Validate digital address reference integrity
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE TABLE ad507.addresses(id uuid PRIMARY KEY)'
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/address-link.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $radar_test$
          DECLARE target uuid; address_ref uuid := gen_random_uuid();
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            BEGIN
              UPDATE radar.establishments SET digital_address_ref=address_ref WHERE id=target;
              RAISE EXCEPTION 'Orphan address accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            INSERT INTO ad507.addresses VALUES(address_ref);
            UPDATE radar.establishments SET digital_address_ref=address_ref WHERE id=target;
            IF NOT EXISTS (SELECT 1 FROM radar.establishments WHERE id=target AND digital_address_ref=address_ref) THEN RAISE EXCEPTION 'Link missing'; END IF;
            DELETE FROM ad507.addresses WHERE id=address_ref;
            IF NOT EXISTS (SELECT 1 FROM radar.establishments WHERE id=target AND digital_address_ref IS NULL AND published) THEN RAISE EXCEPTION 'Deletion retention failed'; END IF;
          END;
          $radar_test$;
          SQL
      - name: Validate promotional campaign storage
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/campaigns.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $radar_campaign$
          DECLARE target uuid;
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            INSERT INTO radar.campaigns(establishment_id,kind,starts_at,ends_at) VALUES(target,'live',now(),now()+interval '1 hour');
            IF EXISTS(SELECT 1 FROM radar.campaigns WHERE status<>'DRAFT') THEN RAISE EXCEPTION 'Campaign activated by default'; END IF;
            BEGIN
              INSERT INTO radar.campaigns(establishment_id,kind,starts_at,ends_at) VALUES(target,'featured',now(),now()-interval '1 hour');
              RAISE EXCEPTION 'Invalid campaign dates accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.campaigns(establishment_id,kind,starts_at,ends_at) VALUES(target,'invalid',now(),now()+interval '1 hour');
              RAISE EXCEPTION 'Invalid campaign type accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END;
          $radar_campaign$;
          SQL
      - name: Exercise approved and expired campaigns
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO radar.campaigns(establishment_id,kind,starts_at,ends_at,status)
          SELECT id,'featured',now()-interval '1 hour',now()+interval '1 hour','APPROVED' FROM radar.establishments WHERE published LIMIT 1;
          INSERT INTO radar.campaigns(establishment_id,kind,starts_at,ends_at,status)
          SELECT establishment_id,'live',now()-interval '2 hours',now()-interval '1 hour','APPROVED' FROM radar.campaigns WHERE kind='featured' LIMIT 1;
          SQL
          export RADAR_TEST_DB="postgres://postgres:test-only@$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' radar-db):5432/postgres"
          cd core/runtime
          bun -e 'import {SQL} from "bun"; import {createRadarCampaignLookup} from "./radar/campaign-repository"; const db=new SQL(process.env.RADAR_TEST_DB); try {const rows=await db.unsafe("SELECT id::text FROM radar.establishments WHERE published");const ids=rows.map(r=>r.id);const active=await createRadarCampaignLookup(db,true)(ids);if(active.size!==1||[...active.values()][0].kind!=="featured")throw Error("Unexpected active campaigns");if((await createRadarCampaignLookup(db,false)(ids)).size!==0)throw Error("Disabled campaign leaked");} finally {await db.close();}'
      - name: Validate anonymous report identity and abuse limits
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < db/migrations/0017_radar_anonymous_reports.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $anonymous_test$
          DECLARE target uuid; visitor text := repeat('a',64); actor uuid := gen_random_uuid();
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            INSERT INTO ad507.users VALUES(actor);
            INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state) VALUES(target,visitor,'available');
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state) VALUES(target,visitor,'full');
              RAISE EXCEPTION 'Anonymous duplicate accepted';
            EXCEPTION WHEN SQLSTATE 'P4290' THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state,source) VALUES(target,repeat('b',64),'full','verified_owner');
              RAISE EXCEPTION 'Anonymous owner accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,state) VALUES(target,'available');
              RAISE EXCEPTION 'Missing identity accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state) VALUES(target,'invalid-digest','available');
              RAISE EXCEPTION 'Malformed digest accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,account_ref,anonymous_ref,state) VALUES(target,actor,repeat('c',64),'available');
              RAISE EXCEPTION 'Mixed identity accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            INSERT INTO radar.activity_reports(establishment_id,account_ref,state) VALUES(target,actor,'queue');
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,account_ref,state) VALUES(target,actor,'full');
              RAISE EXCEPTION 'Registered duplicate accepted';
            EXCEPTION WHEN SQLSTATE 'P4290' THEN NULL;
            END;
            IF (SELECT count(*) FROM radar.activity_reports WHERE anonymous_ref=visitor) <> 1 THEN RAISE EXCEPTION 'Anonymous persistence failed'; END IF;
          END;
          $anonymous_test$;
          SQL
      - name: Validate community confirmations and contradictions
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < db/migrations/0018_radar_activity_confirmations.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $confirm_test$
          DECLARE target uuid; first_report uuid; old_report uuid; voter uuid := gen_random_uuid();
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            INSERT INTO ad507.users VALUES(voter);
            INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state) VALUES(target,repeat('d',64),'queue') RETURNING id INTO first_report;
            INSERT INTO radar.activity_confirmations(report_id,account_ref,agrees) VALUES(first_report,voter,true);
            INSERT INTO radar.activity_confirmations(report_id,anonymous_ref,agrees) VALUES(first_report,repeat('e',64),false);
            BEGIN
              INSERT INTO radar.activity_confirmations(report_id,anonymous_ref,agrees) VALUES(first_report,repeat('d',64),true);
              RAISE EXCEPTION 'Self validation accepted';
            EXCEPTION WHEN SQLSTATE 'P4090' THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_confirmations(report_id,account_ref,agrees) VALUES(first_report,voter,true);
              RAISE EXCEPTION 'Duplicate validation accepted';
            EXCEPTION WHEN unique_violation OR SQLSTATE 'P4290' THEN NULL;
            END;
            INSERT INTO radar.activity_reports(establishment_id,anonymous_ref,state,created_at) VALUES(target,repeat('f',64),'full',now()-interval '31 minutes') RETURNING id INTO old_report;
            BEGIN
              INSERT INTO radar.activity_confirmations(report_id,anonymous_ref,agrees) VALUES(old_report,repeat('9',64),true);
              RAISE EXCEPTION 'Expired report accepted';
            EXCEPTION WHEN SQLSTATE 'P4040' THEN NULL;
            END;
            IF (SELECT count(*) FROM radar.activity_confirmations WHERE report_id=first_report)<>2 THEN RAISE EXCEPTION 'Invalid validation count'; END IF;
          END;
          $confirm_test$;
          SQL
      - name: Validate account-scoped Radar favorites
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < db/migrations/0019_radar_favorites.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $favorite_test$
          DECLARE target uuid; hidden_target uuid; actor uuid := gen_random_uuid(); other_actor uuid := gen_random_uuid();
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            INSERT INTO ad507.users VALUES(actor),(other_actor);
            INSERT INTO radar.favorites(account_ref,establishment_id) VALUES(actor,target),(other_actor,target);
            INSERT INTO radar.favorites(account_ref,establishment_id) VALUES(actor,target) ON CONFLICT DO NOTHING;
            IF (SELECT count(*) FROM radar.favorites WHERE establishment_id=target)<>2 THEN RAISE EXCEPTION 'Invalid favorite uniqueness'; END IF;
            INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude) VALUES(actor,'Favorite private fixture','shop','PA',8,-80) RETURNING id INTO hidden_target;
            BEGIN
              INSERT INTO radar.favorites(account_ref,establishment_id) VALUES(actor,hidden_target);
              RAISE EXCEPTION 'Unpublished favorite accepted';
            EXCEPTION WHEN SQLSTATE 'P4040' THEN NULL;
            END;
            DELETE FROM radar.favorites WHERE account_ref=actor AND establishment_id=target;
            IF NOT EXISTS(SELECT 1 FROM radar.favorites WHERE account_ref=other_actor AND establishment_id=target) THEN RAISE EXCEPTION 'Other account favorite removed'; END IF;
          END;
          $favorite_test$;
          SQL
      - name: Validate private Radar alert subscriptions
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < db/migrations/0020_radar_alert_preferences.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $alert_test$
          DECLARE target uuid; actor uuid := gen_random_uuid(); other_actor uuid := gen_random_uuid();
          BEGIN
            SELECT id INTO STRICT target FROM radar.establishments WHERE published LIMIT 1;
            INSERT INTO ad507.users VALUES(actor),(other_actor);
            INSERT INTO radar.favorites(account_ref,establishment_id) VALUES(actor,target);
            INSERT INTO radar.alert_preferences(account_ref,establishment_id,activity) VALUES(actor,target,'available');
            BEGIN
              INSERT INTO radar.alert_preferences(account_ref,establishment_id,activity) VALUES(other_actor,target,'available');
              RAISE EXCEPTION 'Alert without favorite accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.alert_preferences(account_ref,establishment_id,activity) VALUES(actor,target,'unknown');
              RAISE EXCEPTION 'Invalid alert accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            DELETE FROM radar.favorites WHERE account_ref=actor AND establishment_id=target;
            IF EXISTS(SELECT 1 FROM radar.alert_preferences WHERE account_ref=actor) THEN RAISE EXCEPTION 'Orphan alert'; END IF;
          END;
          $alert_test$;
          SQL
  core-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun test tests
        env:
          AD507_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:55439/postgres
