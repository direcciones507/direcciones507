name: Radar validation
on:
  push:
    branches: ["feature/radar-en-vivo"]
  pull_request:
    paths: ["core/runtime/radar/**", "core/runtime/tests/radar-*.test.ts", ".github/workflows/radar-validation.yml"]
permissions:
  contents: read
jobs:
  radar-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Run Radar unit tests
        working-directory: core/runtime
        run: bun test tests/radar-*.test.ts
  radar-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema and constraints
        run: |
          docker run --name radar-db -d -e POSTGRES_PASSWORD=test-only postgres:18.1
          for i in $(seq 1 30); do
            if docker exec radar-db pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/schema.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
          VALUES ('test-account','Test','shop','PA',8,-80);
          INSERT INTO radar.activity_reports(establishment_id,account_ref,state)
          SELECT id,'test-account','available' FROM radar.establishments;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM radar.establishments WHERE NOT published) <> 1 THEN
              RAISE EXCEPTION 'Unexpected publication default';
            END IF;
            BEGIN
              INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
              VALUES ('test','Invalid','shop','PA',99,-80);
              RAISE EXCEPTION 'Invalid coordinate accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;
          SQL
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Exercise repository against PostgreSQL
        working-directory: core/runtime
        run: |
          export RADAR_TEST_DB="postgres://postgres:test-only@$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' radar-db):5432/postgres"
          bun -e '
            import { SQL } from "bun";
            import { createRadarRepository } from "./radar/repository";
            import { createModerationStore } from "./radar/moderation-repository";
            const db = new SQL(process.env.RADAR_TEST_DB);
            try {
              await db.unsafe("UPDATE radar.establishments SET published=true");
              const repo = createRadarRepository(db);
              const draft={name:"New shop",category:"shop",country:"PA",latitude:8.1,longitude:-80.1};
              const created=await repo.register(draft,"test-account");
              if(!created) throw Error("Registration failed");
              if(await repo.register({...draft,name:" NEW SHOP "},"another-account")) throw Error("Duplicate accepted");
              if(await repo.findPublished(created)) throw Error("Pending registration leaked");
              const rows = await repo.listPublished("PA",{west:-83,south:7,east:-77,north:10});
              if(rows.length!==1 || rows[0].reports.length!==1) throw Error("Map query failed");
              if(!(await repo.findPublished(rows[0].id))) throw Error("Lookup failed");
              await repo.addReport(rows[0].id,"test-account","queue","community");
              const updated=await repo.listPublished("PA",{west:-83,south:7,east:-77,north:10});
              if(updated[0].reports.length!==2) throw Error("Report persistence failed");
              const moderation=createModerationStore(db);
              const pending=await moderation.pending(100);
              if(pending.length!==1 || pending[0].id!==created) throw Error("Pending list failed");
              if(!(await moderation.publish(created))) throw Error("Publication failed");
              if(await moderation.publish(created)) throw Error("Repeated approval accepted");
              if(!(await repo.findPublished(created))) throw Error("Published establishment unavailable");
              if((await moderation.pending(100)).length!==0) throw Error("Published item still pending");
            } finally { await db.close(); }
          '
      - name: Validate shared account foreign keys
        run: |
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA ad507;
          CREATE TABLE ad507.users(id uuid PRIMARY KEY);
          INSERT INTO ad507.users VALUES ('00000000-0000-4000-8000-000000000001');
          UPDATE radar.establishments SET account_ref='00000000-0000-4000-8000-000000000001';
          UPDATE radar.activity_reports SET account_ref='00000000-0000-4000-8000-000000000001';
          SQL
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 < core/runtime/radar/core-constraints.sql
          docker exec -i radar-db psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            BEGIN
              INSERT INTO radar.establishments(account_ref,name,category,country,latitude,longitude)
              VALUES ('00000000-0000-4000-8000-000000000002','Orphan','shop','PA',8,-80);
              RAISE EXCEPTION 'Orphan account accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO radar.activity_reports(establishment_id,account_ref,state)
              SELECT id,'00000000-0000-4000-8000-000000000002','available' FROM radar.establishments LIMIT 1;
              RAISE EXCEPTION 'Orphan reporter accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            IF NOT EXISTS (SELECT 1 FROM radar.establishments) THEN RAISE EXCEPTION 'Existing records lost'; END IF;
          END $;
          SQL
  core-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun test tests
        env:
          AD507_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:55439/postgres
