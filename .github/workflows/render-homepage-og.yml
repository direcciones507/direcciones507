name: Render homepage Open Graph cards
on:
  push:
    paths:
      - 'og-source/og-507-2026.svg'
      - 'og-source/og-latam-2026.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Render PNG images for crawlers
        run: |
          rsvg-convert -w 1200 -h 630 og-source/og-507-2026.svg -o og-507-2026.png
          rsvg-convert -w 1200 -h 630 og-source/og-latam-2026.svg -o og-latam-2026.png
          file og-507-2026.png og-latam-2026.png
      - name: Commit generated social preview images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-507-2026.png og-latam-2026.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(og): render PNG social preview images'
            git push origin HEAD
          fi
