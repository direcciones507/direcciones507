name: Residential visual hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/residential-visual-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/residential_visual_hotfix.py
      - name: Commit index
        run: |
          git config user.name "direcciones507-automation"
          git config user.email "ventas@direcciones507.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Polish residential card and restore resident WhatsApp"
          git push origin HEAD:main
