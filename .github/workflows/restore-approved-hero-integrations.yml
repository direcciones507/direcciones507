name: Restore approved hero integrations

on:
  push:
    branches:
      - restore-approved-hero-integrations
    paths:
      - .github/workflows/restore-approved-hero-integrations.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-approved-hero-integrations
      - name: Restore approved hero visual only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          map_block = '''        <div class="map-art-container">\n          <div id="mapaPanamaReal"></div>\n        </div>\n'''
          if map_block in s:
              s = s.replace(map_block, '', 1)

          integrations = '''\n          <div class="hero-integrations" aria-label="Aplicaciones integradas">\n            <div class="hero-integrations-title">Integramos tus aplicaciones directamente</div>\n            <div class="hero-integrations-row">\n              <div class="hero-integration-item"><i class="fa-solid fa-location-dot"></i><span>Google Maps</span></div>\n              <div class="hero-integration-item"><i class="fa-brands fa-waze"></i><span>Waze</span></div>\n              <div class="hero-integration-item"><i class="fa-brands fa-uber"></i><span>Uber</span></div>\n              <div class="hero-integration-item"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></div>\n              <div class="hero-integration-item"><i class="fa-solid fa-qrcode"></i><span>Código QR</span></div>\n            </div>\n          </div>\n\n'''
          marker = '          <div class="category-pills-row">'
          if 'class="hero-integrations"' not in s:
              if marker not in s:
                  raise SystemExit('Category marker not found; refusing to modify')
              s = s.replace(marker, integrations + marker, 1)

          css_marker = '    /* ===== CTA DIRECCION GRATIS ===== */'
          css = '''    /* ===== RESTAURAR HERO APROBADO ===== */\n    #mainGlobalHeroView .hero-grid-layout {\n      grid-template-columns: 1fr;\n      max-width: 960px;\n      margin: 0 auto;\n      gap: 0;\n      text-align: center;\n    }\n    #mainGlobalHeroView .hero-grid-layout > div:first-child { width: 100%; }\n    #mainGlobalHeroView .map-art-container { display: none !important; }\n    .hero-integrations {\n      width: 100%;\n      max-width: 820px;\n      margin: 0 auto 28px;\n      padding: 20px 12px 22px;\n      border-top: 1px solid rgba(255,255,255,0.06);\n      border-bottom: 1px solid rgba(255,255,255,0.06);\n      text-align: center;\n    }\n    .hero-integrations-title {\n      color: var(--cyan-brand);\n      font-size: 12px;\n      font-weight: 800;\n      text-transform: uppercase;\n      letter-spacing: .7px;\n      margin-bottom: 16px;\n    }\n    .hero-integrations-row {\n      display: grid;\n      grid-template-columns: repeat(5, minmax(0,1fr));\n      gap: 10px;\n      align-items: center;\n    }\n    .hero-integration-item {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 7px;\n      color: #e2e8f0;\n      font-size: 12px;\n      font-weight: 650;\n    }\n    .hero-integration-item i { color: var(--cyan-brand); font-size: 24px; }\n    .hero-integration-item .fa-whatsapp { color: #25d366; }\n    @media (max-width: 640px) {\n      .hero-integrations-row { grid-template-columns: repeat(3, minmax(0,1fr)); row-gap: 18px; }\n      .hero-integration-item i { font-size: 22px; }\n    }\n\n'''
          if 'RESTAURAR HERO APROBADO' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found; refusing to modify')
              s = s.replace(css_marker, css + css_marker, 1)

          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-approved-hero-integrations.yml
          git add index.html
          git commit -m "Restore approved hero integrations"
          git push origin HEAD:restore-approved-hero-integrations
