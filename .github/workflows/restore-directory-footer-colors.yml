name: Restore directory and footer colors

on:
  push:
    branches:
      - restore-directory-footer-colors
    paths:
      - .github/workflows/restore-directory-footer-colors.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-directory-footer-colors
      - name: Restore only visual colors
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_social = "    .social-pill-large.wa-color { border-color: rgba(37, 211, 102, 0.4); background: rgba(37, 211, 102, 0.05); }\n    .social-pill-large.wa-color i { color: #25d366; }\n    .social-pill-large.ig-color { border-color: rgba(214, 41, 118, 0.4); background: rgba(214, 41, 118, 0.05); }\n    .social-pill-large.ig-color i { color: #d62976; }\n    .social-pill-large.tk-color { border-color: rgba(255, 0, 80, 0.4); background: rgba(255, 0, 80, 0.05); }\n    .social-pill-large.tk-color i { color: #00f2fe; }"
          new_social = "    .social-pill-large { transition: transform .22s ease, filter .22s ease, box-shadow .22s ease; }\n    .social-pill-large:hover { transform: translateY(-2px); filter: brightness(1.08); }\n    .social-pill-large.wa-color { border-color: rgba(37, 211, 102, 0.72); background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; box-shadow: 0 8px 20px rgba(37,211,102,.18); }\n    .social-pill-large.wa-color i { color: #fff; }\n    .social-pill-large.ig-color { border-color: rgba(253, 29, 29, 0.55); background: linear-gradient(135deg, #833ab4, #c13584 45%, #fd1d1d 72%, #fcb045); color: #fff; box-shadow: 0 8px 20px rgba(193,53,132,.18); }\n    .social-pill-large.ig-color i { color: #fff; }\n    .social-pill-large.tk-color { border-color: rgba(255,255,255,.2); background: #000000; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.28); }\n    .social-pill-large.tk-color i { color: #fff; }"
          old_dir = "    .seo-trigger-link { color: var(--text-muted); text-decoration: none; font-size: 12px; background: rgba(255, 255, 255, 0.02); padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; }"
          new_dir = "    .seo-trigger-link { color: #dbeafe; text-decoration: none; font-size: 12px; font-weight: 700; background: linear-gradient(135deg, rgba(15,23,42,.88), rgba(8,47,73,.72)); padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(6,182,212,.38); cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,.18); transition: all .22s ease; }\n    .seo-trigger-link:hover { color: #ffffff; border-color: rgba(6,182,212,.8); background: linear-gradient(135deg, rgba(8,145,178,.28), rgba(37,99,235,.24)); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(6,182,212,.14); }"
          if s.count(old_social) != 1:
              raise SystemExit('Expected social color block not found exactly once; refusing to modify')
          if s.count(old_dir) != 1:
              raise SystemExit('Expected directory style not found exactly once; refusing to modify')
          s = s.replace(old_social, new_social, 1).replace(old_dir, new_dir, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-directory-footer-colors.yml
          git add index.html
          git commit -m "Restore directory and footer button colors"
          git push origin HEAD:restore-directory-footer-colors
