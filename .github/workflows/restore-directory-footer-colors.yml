name: Restore directory and footer colors
on:
  push:
    branches: [restore-directory-footer-colors]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only visual colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_social = '''    .social-pill-large.wa-color { border-color: rgba(37, 211, 102, 0.4); background: rgba(37, 211, 102, 0.05); }
    .social-pill-large.wa-color i { color: #25d366; }
    .social-pill-large.ig-color { border-color: rgba(214, 41, 118, 0.4); background: rgba(214, 41, 118, 0.05); }
    .social-pill-large.ig-color i { color: #d62976; }
    .social-pill-large.tk-color { border-color: rgba(255, 0, 80, 0.4); background: rgba(255, 0, 80, 0.05); }
    .social-pill-large.tk-color i { color: #00f2fe; }'''
          new_social = '''    .social-pill-large { transition: transform .22s ease, filter .22s ease, box-shadow .22s ease; }
    .social-pill-large:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .social-pill-large.wa-color { border-color: rgba(37, 211, 102, 0.72); background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; box-shadow: 0 8px 20px rgba(37,211,102,.18); }
    .social-pill-large.wa-color i { color: #fff; }
    .social-pill-large.ig-color { border-color: rgba(253, 29, 29, 0.55); background: linear-gradient(135deg, #833ab4, #c13584 45%, #fd1d1d 72%, #fcb045); color: #fff; box-shadow: 0 8px 20px rgba(193,53,132,.18); }
    .social-pill-large.ig-color i { color: #fff; }
    .social-pill-large.tk-color { border-color: rgba(255,255,255,.2); background: #000000; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.28); }
    .social-pill-large.tk-color i { color: #fff; }'''
          if old_social in text:
              text = text.replace(old_social, new_social, 1)

          old_dir = '    .seo-trigger-link { color: var(--text-muted); text-decoration: none; font-size: 12px; background: rgba(255, 255, 255, 0.02); padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; }'
          new_dir = '''    .seo-trigger-link { color: #dbeafe; text-decoration: none; font-size: 12px; font-weight: 700; background: linear-gradient(135deg, rgba(15,23,42,.88), rgba(8,47,73,.72)); padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(6,182,212,.38); cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,.18); transition: all .22s ease; }
    .seo-trigger-link:hover { color: #ffffff; border-color: rgba(6,182,212,.8); background: linear-gradient(135deg, rgba(8,145,178,.28), rgba(37,99,235,.24)); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(6,182,212,.14); }'''
          if old_dir in text:
              text = text.replace(old_dir, new_dir, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/restore-directory-footer-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-directory-footer-colors.yml
          git commit -m "Restore directory and footer button colors"
          git push
