name: Security audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Audit locked dependencies (including development)
        working-directory: core/runtime
        run: bun audit
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git history without publishing secret details
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb'
          docker pull "$image"
          report="$(mktemp -d)"
          trap 'rm -rf "$report"' EXIT
          # Execute both scans independently and retain scanner errors.
          set +e
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/report" \
            "$image" git /repo --log-opts="--all" --redact=100 --no-banner \
            --report-format=json --report-path=/report/history.json --exit-code=42 \
            >/dev/null 2>&1
          history_code=$?
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/report" \
            "$image" dir /repo --redact=100 --no-banner \
            --report-format=json --report-path=/report/current.json --exit-code=42 \
            >/dev/null 2>&1
          current_code=$?
          python3 .github/scripts/review-gitleaks.py history "$report/history.json" "$history_code" "$GITHUB_WORKSPACE"
          history_result=$?
          python3 .github/scripts/review-gitleaks.py current "$report/current.json" "$current_code" "$GITHUB_WORKSPACE"
          current_result=$?
          set -e
          if [ "$history_result" -ne 0 ] || [ "$current_result" -ne 0 ]; then
            echo "::error::Security audit has unreviewed findings or did not complete."
            exit 1
          fi
          echo "Both scans completed; no unresolved findings."
