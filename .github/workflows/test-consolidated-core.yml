name: Consolidated Core compatibility
on:
  push:
    branches: ["feat/core-consolidated-oauth-20261006"]
  pull_request:
    paths: ["core/runtime/**", "db/migrations/0005_general_google_auth.sql", ".github/workflows/test-consolidated-core.yml"]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Cancel superseded compatibility runs on this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref ?? context.ref.replace('refs/heads/', '');
            const head = context.payload.pull_request?.head.sha ?? context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, branch, per_page: 50 });
            for (const run of data.workflow_runs) {
              if (run.name === 'Consolidated Core compatibility' && run.head_sha !== head && ['queued','in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: python scripts/validate-migrations.py
      - run: bun install --frozen-lockfile
        working-directory: core/runtime
      - run: bun run check:legacy
        working-directory: core/runtime
      - run: bun build server.ts --target bun --external postgres --outfile /tmp/ad507-core-review.js
        working-directory: core/runtime
      - run: docker build --tag ad507-core-review --file core/runtime/Dockerfile .
      - run: timeout 90s bun test tests
        working-directory: core/runtime
        env:
          AD507_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:55439/postgres
