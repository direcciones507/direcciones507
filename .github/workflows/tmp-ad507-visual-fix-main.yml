name: Temporary AD507 visual fix main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual correction
        shell: python
        run: |
          from pathlib import Path
          p=Path('ad507.template.html'); s=p.read_text()
          css=r'''

    /* ===== AJUSTE VISUAL OCT-2026: MARCA DE AGUA + CONTROLES CLAROS ===== */
    .verified-title-sub { color:#ffffff; }
    #codigo { color:#f4c95d; }
    .identity-block { position:relative; isolation:isolate; overflow:hidden; }
    .identity-block::before { content:''; position:absolute; inset:0; z-index:-1; background-image:var(--business-logo,none); background-repeat:no-repeat; background-position:78% 50%; background-size:min(44%,330px) auto; opacity:.10; filter:grayscale(1) brightness(1.65) contrast(.8); pointer-events:none; }
    #logoBox,.title-details-header { position:relative; z-index:1; }
    .white-sheet { background:linear-gradient(180deg,#081426 0%,#06101e 100%); color:#0f172a; }
    .btn-action-triple,.btn-social-quad,.accordion-item,.qr-box { background:#fff; border-color:#e2e8f0; color:#111827; box-shadow:0 8px 22px rgba(0,0,0,.16); }
    .btn-action-triple,.btn-social-quad,.accordion-value,.qr-box h3 { color:#111827; }
    .btn-action-triple p,.accordion-label { color:#64748b; }
    .accordion-item:hover { background:#f8fafc; border-color:#cbd5e1; }
    .accordion-icon-left { background:#fff; color:#111827; border:1px solid #d7dde5; box-shadow:0 2px 7px rgba(15,23,42,.08); }
    .accordion-arrow-right,#btnRef .accordion-icon-left i,#btnHorario .accordion-icon-left i,#btnCall i,#btnShare i,#btnQR .accordion-icon-left i { color:#111827; }
    #btnGoogleSecundario i { color:#4285f4; }
    .main-nav-grid { background:linear-gradient(180deg,#06101e 0%,#050b14 100%); }
    .nav-box { background:#fff; color:#111827; border:1px solid #e2e8f0; box-shadow:0 8px 22px rgba(0,0,0,.16); }
    .nav-box .nav-box-text h4 { color:#111827; }
    .nav-box .nav-box-text p { color:#64748b; opacity:1; }
    .box-google i { color:#4285f4; } .box-waze i { color:#33ccff; } .box-uber i { color:#000; } .box-whatsapp i { color:#25d366; }
    .btn-social-quad.ig i { color:#e1306c; } .btn-social-quad.tk i { color:#000; } .btn-social-quad.fb i { color:#1877f2; } .btn-social-quad.web i { color:#2563eb; }
    @media(max-width:767px){ .identity-block::before{background-position:88% 50%;background-size:min(55%,230px) auto;opacity:.09;} }
    @media(min-width:768px){ #codigo{color:#f4c95d;} .verified-title-sub{color:#fff;} .identity-block::before{opacity:.10;} .white-sheet{background:linear-gradient(180deg,#081426 0%,#06101e 100%);} }
'''
          if 'AJUSTE VISUAL OCT-2026' not in s: s=s.replace('  </style>',css+'\n  </style>',1)
          old="document.getElementById('logoNegocio').src = normalizarImagenDrive(data.logo);\n      document.getElementById('logoBox').style.display = 'block';"
          new="const businessLogoUrl = normalizarImagenDrive(data.logo);\n      document.getElementById('logoNegocio').src = businessLogoUrl;\n      document.querySelector('.identity-block').style.setProperty('--business-logo', `url(\"${businessLogoUrl.replace(/\"/g, '%22')}\")`);\n      document.getElementById('logoBox').style.display = 'block';"
          if old not in s: raise SystemExit('Logo anchor not found')
          s=s.replace(old,new,1); p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ad507.template.html
          git commit -m "fix: refinar identidad visual de plantilla AD507"
          git push
