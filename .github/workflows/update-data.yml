name: 🚀 Actualizar datos desde Excel

on:
  push:
    paths:
      - 'AD507_MASTER_FINAL_PANAMA_CORREGIDO_v2.xlsx'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: 🔄 Convertir Excel a JSON
        run: |
          python convert_excel_to_json.py

      - name: 📤 Subir cambios automáticamente
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add datos/clientes.json
          git diff --cached --quiet || git commit -m "📊 Actualizar datos desde Excel - $(date '+%Y-%m-%d %H:%M')"
          git push
