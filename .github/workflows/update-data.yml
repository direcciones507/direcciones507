name: 🚀 Actualizar datos desde Excel

on:
  push:
    paths:
      - 'AD507_MASTER_FINAL_PANAMA.xlsx'
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas
  workflow_dispatch:  # Ejecución manual

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v3
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Instalar dependencias
        run: |
          pip install pandas openpyxl
          
      - name: 🔄 Convertir Excel a JSON
        run: |
          python convert_excel_to_json.py
          
      - name: 📤 Subir cambios automáticamente
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "🤖 GitHub Actions"
          git add datos/clientes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Actualizar datos desde Excel - $(date '+%Y-%m-%d %H:%M')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🎉 Completado
        run: echo "✅ Proceso completado"
