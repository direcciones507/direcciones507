name: Validate DB migrations

on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'scripts/validate-migrations.py'
      - '.github/workflows/validate-db-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration safety rules
        run: python3 scripts/validate-migrations.py
