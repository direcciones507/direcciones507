<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada | Direcciones507</title>
  <meta name="robots" content="noindex,follow">
  <script>
    (async function () {
      var path = (window.location.pathname || "").replace(/^\/+|\/+$/g, "");
      if (!/^AD507-[A-Za-z0-9]+$/i.test(path)) return;

      var code = path.toUpperCase();
      var CORE = "https://ad507-core-production.up.railway.app";
      var MASTER = "https://script.google.com/macros/s/AKfycbwGtlH6FVh80hlT-9gzhVbgxpFHRnerep5NGULSSRuoF62iWB3q2hmICMlAMS9nwQyq/exec";

      function showBusiness() {
        document.title = code + " | Direcciones507";
        document.documentElement.style.height = "100%";
        document.body.innerHTML = "";
        document.body.style.cssText = "margin:0;height:100%;overflow:hidden;background:#0b0f19";
        var frame = document.createElement("iframe");
        frame.src = "/?code=" + encodeURIComponent(code);
        frame.title = "Dirección Digital " + code;
        frame.style.cssText = "border:0;width:100%;height:100%;display:block";
        frame.setAttribute("allow", "geolocation; clipboard-read; clipboard-write");
        document.body.appendChild(frame);
      }

      try {
        var response = await fetch(CORE + "/internal/v1/residential/entry/resolve", {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          headers: {"content-type": "application/json"},
          body: JSON.stringify({entry_id: code})
        });
        var result = await response.json().catch(function () { return null; });

        if (response.ok && result && result.residential === true) {
          window.location.replace("/?residential=" + encodeURIComponent(code) + "&entry=short-v2");
          return;
        }
        if (response.ok && result && result.residential === false) {
          showBusiness();
          return;
        }
      } catch (_) {}

      try {
        var businessResponse = await fetch(MASTER + "?code=" + encodeURIComponent(code), {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          redirect: "follow",
          headers: {"accept": "application/json"}
        });
        if (!businessResponse.ok) return;

        var data = await businessResponse.json();
        if (!data || data.ok === false || data.status === "error") return;

        var returnedCode = String(data.codigo || data.code || "").trim().toUpperCase();
        if (returnedCode !== code) return;

        var rawPlan = String(data.plan || data.plan_comercial || "").trim().toLowerCase();
        var isResidential =
          String(data.tipo_direccion || "").trim().toUpperCase() === "RESIDENCIAL" ||
          data.publico === false ||
          rawPlan === "persona" ||
          rawPlan === "residencial" ||
          rawPlan.indexOf("residencial") !== -1;

        if (!isResidential) showBusiness();
      } catch (_) {
        // Fallo cerrado: si el código no se confirma, se conserva el 404.
      }
    })();
  </script>
  <style>
    body{
      font-family:system-ui;
      background:#0b0f19;
      color:white;
      text-align:center;
      padding:60px 20px;
    }
    a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>La página que buscas no existe.</p>
  <p><a href="/">Volver al inicio</a></p>
</body>
</html>
