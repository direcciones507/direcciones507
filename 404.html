<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Direcciones507</title>
  <script>
    (function () {
      // Normaliza path y soporta trailing slash
      var path = window.location.pathname || "/";
      var parts = path.split("/").filter(Boolean); // quita vacíos

      // Detecta base:
      // - Dominio propio: /AD507-0006  -> base "/"
      // - GitHub pages:   /direcciones507/AD507-0006 -> base "/direcciones507/"
      var base = "/";
      if (parts.length >= 2 && parts[0].toLowerCase() === "direcciones507") {
        base = "/direcciones507/";
      }

      // El código es el último segmento
      var code = parts.length ? parts[parts.length - 1] : "";

      // Si viene con slash al final, filter(Boolean) ya lo arregla.
      // Validación del formato
      if (code && /^ad507-\d+$/i.test(code)) {
  code = code.toUpperCase();
        window.location.replace(base + "?code=" + encodeURIComponent(code));
      } else {
        window.location.replace(base);
      }
    })();
  </script>
</head>
<body></body>
</html>
