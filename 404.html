<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada | Direcciones507</title>
  <meta name="robots" content="noindex,follow">
  <script>
    (async function () {
      var path = (window.location.pathname || "").replace(/^\/+|\/+$/g, "");
      if (/^AD507-[A-Za-z0-9]+$/i.test(path)) {
        var code = path.toUpperCase();
        try {
          var response = await fetch("https://ad507-core-production.up.railway.app/internal/v1/residential/entry/resolve", {
            method: "POST",
            mode: "cors",
            cache: "no-store",
            headers: {"content-type": "application/json"},
            body: JSON.stringify({entry_id: code})
          });
          var result = await response.json();
          if (response.ok && result && result.residential === true) {
            window.location.replace("/?residential=" + encodeURIComponent(code) + "&entry=short-v2");
            return;
          }
          if (response.ok && result && result.residential === false) {
            window.location.replace("/?code=" + encodeURIComponent(code));
          }
        } catch (_) {
          // Fallo cerrado: una indisponibilidad del resolver nunca convierte
          // una ruta desconocida en acceso comercial.
        }
      }
    })();
  </script>
  <style>
    body{
      font-family:system-ui;
      background:#0b0f19;
      color:white;
      text-align:center;
      padding:60px 20px;
    }
    a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>La página que buscas no existe.</p>
  <p><a href="/">Volver al inicio</a></p>
</body>
</html>
