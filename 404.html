<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AD507</title>
  <script>
    (function () {
      // Ej: /direcciones507/AD507-0001
      var path = window.location.pathname;
      var parts = path.split("/").filter(Boolean);

      // parts: ["direcciones507","AD507-0001"]
      var code = parts.length >= 2 ? parts[parts.length - 1] : "";

      // Si parece un código, redirige a ?code=
      if (code && /^AD507-\d+$/i.test(code)) {
        var base = "/" + parts[0] + "/"; // "/direcciones507/"
        window.location.replace(base + "?code=" + encodeURIComponent(code));
      } else {
        // Si no, vuelve al inicio
        window.location.replace("/" + (parts[0] || "") + "/");
      }
    })();
  </script>
</head>
<body></body>
</html>
