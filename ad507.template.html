<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dirección AD507-CODE | Ubicación exacta en Panamá</title>

<meta name="description" content="Ubicación exacta AD507-CODE en Panamá. Abre la dirección en Google Maps, Waze o Uber sin perderte.">

<link rel="canonical" href="https://direcciones507.com/{{SLUG}}/">
<meta name="robots" content="index,follow">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">

<style>
body{
  font-family:system-ui;
  background:#0b0f19;
  color:white;
  text-align:center;
  padding:40px;
}
.card{
  background:#111827;
  padding:30px;
  border-radius:12px;
  max-width:600px;
  margin:auto;
}
.btn{
  display:inline-block;
  padding:12px 18px;
  margin:6px;
  border-radius:8px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="card">

<h1 id="codigo">AD507-CODE</h1>

<p id="estado">Cargando dirección...</p>

<div id="datos" style="display:none">

<p><b>Nombre:</b> <span id="nombre"></span></p>
<p><b>Referencia:</b> <span id="ref"></span></p>

<div style="margin-top:15px">
  <a id="btnGoogle" class="btn" target="_blank" rel="noopener">Google Maps</a>
  <a id="btnWaze" class="btn" target="_blank" rel="noopener">Waze</a>
  <a id="btnUber" class="btn" target="_blank" rel="noopener">Uber</a>
  <a id="btnWhats" class="btn" target="_blank" rel="noopener">WhatsApp</a>
</div>

<div id="qrBox" style="margin-top:28px;display:none">
  <p style="margin-bottom:12px;font-weight:700">QR para compartir</p>
  <img id="qrImg" alt="QR AD507" style="width:180px;max-width:100%;border-radius:12px;background:#fff;padding:10px">
  <p style="margin-top:10px;font-size:14px;color:#cbd5e1">
    Escanea y abre esta dirección digital
  </p>
</div>

</div>

<script>
const CODE = "AD507-CODE";
const SLUG = "{{SLUG}}";
const PAGE_URL = `https://direcciones507.com/${SLUG}/`;

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyBnLcLaTEPKKdAQULGFIdxhPrA77QRSzJSpSZl3nXGCvNfyYRuooprKON1pZ6s976ZvQ/exec";

async function cargar(){
  try{
    const r = await fetch(`${WEBAPP_URL}?code=${encodeURIComponent(CODE)}`);
    const data = await r.json();

    if(!data.ok){
      document.getElementById("estado").textContent = "Dirección no encontrada";
      return;
    }

    document.getElementById("estado").style.display = "none";
    document.getElementById("datos").style.display = "block";

    document.getElementById("nombre").textContent = data.nombre || "-";
    document.getElementById("ref").textContent = data.referencia || "-";

    const btnGoogle = document.getElementById("btnGoogle");
    const btnWaze = document.getElementById("btnWaze");
    const btnUber = document.getElementById("btnUber");
    const btnWhats = document.getElementById("btnWhats");

    if(data.gmaps) btnGoogle.href = data.gmaps;
    else btnGoogle.style.display = "none";

    if(data.waze) btnWaze.href = data.waze;
    else btnWaze.style.display = "none";

    if(data.uber) btnUber.href = data.uber;
    else btnUber.style.display = "none";

    if(data.telefono){
      btnWhats.href = `https://wa.me/${data.telefono}`;
    }else{
      btnWhats.style.display = "none";
    }

    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(PAGE_URL)}`;
    document.getElementById("qrImg").src = qrUrl;
    document.getElementById("qrBox").style.display = "block";

  }catch(e){
    document.getElementById("estado").textContent = "Error cargando datos";
    console.error("Error cargando AD507:", e);
  }
}

cargar();
</script>

</body>
</html>
