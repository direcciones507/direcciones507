<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generador de Enlaces AD507</title>
  <style>
    body{font-family:system-ui,Arial;max-width:780px;margin:0 auto;padding:22px}
    .card{border:1px solid #e7e7e7;border-radius:14px;padding:16px;margin-top:14px}
    label{display:block;margin:10px 0 6px;font-weight:600}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #dcdcdc;font-size:16px}
    button,a.btn{display:inline-block;padding:12px 14px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer;text-decoration:none;color:#111}
    button.primary{border:1px solid #111;background:#111;color:#fff}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .muted{color:#666}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;word-break:break-all}
    .ok{color:#0a7a2f}
    .bad{color:#b00020}
  </style>
</head>
<body>

  <h2>Generador de Enlaces AD507</h2>
  <p class="muted">Pega el código y genera un enlace limpio para abrir el panel (ideal para WhatsApp).</p>

  <div class="card">
    <label for="codigo">Código AD507</label>
    <input id="codigo" placeholder="Ej: AD507-0001" autocomplete="off" />

    <div class="row">
      <button class="primary" onclick="generar()">Generar enlace</button>
      <button onclick="copiar()">Copiar enlace</button>
      <a id="abrir" class="btn" target="_blank" rel="noopener">Abrir panel</a>
    </div>

    <p id="estado" class="muted" style="margin-top:10px;">Listo.</p>

    <div class="card" style="padding:12px;">
      <div class="muted">Enlace generado:</div>
      <div id="salida" class="mono">—</div>
    </div>
  </div>

<script>
/** OPCIONAL: pega aquí tu Web App (/exec) para validar contra Google Sheet.
 * Si lo dejas vacío, igual genera el link sin validar.
 */
const API_URL = ""; // ej: https://script.google.com/macros/s/XXXX/exec

function normalizarCodigo(v){
  return (v || "").trim().toUpperCase().replace(/\s+/g,"");
}

function panelLink(codigo){
  // link limpio: solo codigo
  const base = new URL("panel.html", window.location.href).toString();
  return `${base}?codigo=${encodeURIComponent(codigo)}`;
}

async function validarCodigo(codigo){
  if (!API_URL) return { ok:true, skip:true };
  const res = await fetch(`${API_URL}?codigo=${encodeURIComponent(codigo)}`);
  return await res.json();
}

async function generar(){
  const codigo = normalizarCodigo(document.getElementById("codigo").value);
  const estado = document.getElementById("estado");
  const salida = document.getElementById("salida");
  const abrir  = document.getElementById("abrir");

  if (!codigo){
    estado.textContent = "❌ Escribe un código.";
    estado.className = "bad";
    return;
  }

  estado.textContent = "🔎 Validando…";
  estado.className = "muted";

  try{
    const check = await validarCodigo(codigo);

    if (API_URL && !check.ok){
      estado.textContent = `❌ ${codigo} no válido: ${check.error || "NO_EXISTE"}`;
      estado.className = "bad";
      salida.textContent = "—";
      abrir.href = "#";
      abrir.onclick = (e)=>e.preventDefault();
      return;
    }

    const link = panelLink(codigo);
    salida.textContent = link;
    abrir.href = link;
    abrir.onclick = null;

    estado.textContent = API_URL
      ? `✅ Código válido: ${codigo}`
      : `✅ Enlace listo (sin validación): ${codigo}`;
    estado.className = "ok";

  }catch(err){
    // Si falla la API, igual dejamos generar el link (no te frena ventas)
    const link = panelLink(codigo);
    salida.textContent = link;
    abrir.href = link;
    abrir.onclick = null;

    estado.textContent = "⚠️ No pude validar (API), pero el enlace fue generado.";
    estado.className = "muted";
  }
}

async function copiar(){
  const txt = document.getElementById("salida").textContent.trim();
  const estado = document.getElementById("estado");

  if (!txt || txt === "—"){
    estado.textContent = "❌ Primero genera el enlace.";
    estado.className = "bad";
    return;
  }

  await navigator.clipboard.writeText(txt);
  estado.textContent = "📋 Enlace copiado. Pégalo en WhatsApp.";
  estado.className = "ok";
}

// Si vienen con ?codigo=... lo precarga
document.addEventListener("DOMContentLoaded", ()=>{
  const params = new URLSearchParams(window.location.search);
  const c = params.get("codigo");
  if (c){
    document.getElementById("codigo").value = c;
    generar();
  }
});
</script>

</body>
</html>
