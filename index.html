<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direcciones507</title>

<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;text-align:center;padding:40px}
.card{background:white;color:black;max-width:520px;margin:auto;padding:25px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
input{width:90%;padding:15px;border-radius:12px;border:1px solid #ccc;font-size:18px;text-align:center}
button{margin-top:15px;padding:15px 25px;border:none;border-radius:12px;background:black;color:white;font-size:18px;cursor:pointer}
.links a{display:block;margin:10px;padding:12px;background:black;color:white;border-radius:10px;text-decoration:none}
.muted{color:#334155;font-size:14px}
.err{color:#b91c1c;font-weight:700}
.ok{color:#065f46;font-weight:700}
</style>
</head>

<body>
<h1>AD507 Panamá</h1>
<p>Busca tu dirección digital</p>

<div class="card">
  <input id="codigo" placeholder="Ej: AD507-001">
  <br>
  <button onclick="buscar()">Buscar</button>
  <div id="estado" class="muted" style="margin-top:12px;"></div>
  <div id="resultado" style="margin-top:18px;"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwPdCJV26fREoN_JeLw5T9CCCdrnZmhJWAjBZcOW1OT0DCEHPrkwYsOF_-7QZa_kqNz0Q/exec";

async function buscar(){
  const codigo = document.getElementById("codigo").value.trim();
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  if(!codigo){ estado.className="err"; estado.textContent="Escribe tu código."; return; }

  const url = API_URL + "?code=" + encodeURIComponent(codigo);
  estado.className="muted";
  estado.textContent="Buscando…";

  try{
    const res = await fetch(url);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error("La API no devolvió JSON: " + text.slice(0,120)); }

    if(!data.ok){
      estado.className="err";
      estado.textContent = data.message || "Código no encontrado";
      return;
    }

    estado.className="ok";
    estado.textContent="Listo ✅";

    resultado.innerHTML = `
      <h3 style="margin:0 0 8px 0;">${data.nombre || ""}</h3>
      <div class="links">
        ${data.google_maps ? `<a href="${data.google_maps}" target="_blank">📍 Google Maps</a>` : ""}
        ${data.waze ? `<a href="${data.waze}" target="_blank">🚗 Waze</a>` : ""}
        ${data.uber ? `<a href="${data.uber}" target="_blank">🚕 Uber</a>` : ""}
        ${data.link_whatsapp ? `<a href="${data.link_whatsapp}" target="_blank">💬 Avisar llegada</a>` : ""}
      </div>
    `;
  }catch(err){
    estado.className="err";
    estado.textContent="Error: " + err.message;
  }
}
</script>
</body>
</html>
