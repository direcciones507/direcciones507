<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD507 - Buscar Dirección</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0b1e4a 0%, #1a2f6a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 10px;
        }
        h1 {
            color: #0b1e4a;
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            color: #5a6d8a;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #1a2f6a;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #dde3ed;
            border-radius: 20px;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #1a2f6a;
            outline: none;
            box-shadow: 0 0 0 4px rgba(26,47,106,0.1);
        }
        .btn {
            background: #1a2f6a;
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn:hover {
            background: #0f2350;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .feature {
            background: #f5f8ff;
            padding: 20px 10px;
            border-radius: 20px;
            text-align: center;
        }
        .feature i {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }
        .feature span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #1a2f6a;
        }
        .footer {
            margin-top: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #eef2f7;
            border-radius: 20px;
            display: none;
        }
        .result.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">📍🇵🇦</div>
            <h1>AD507</h1>
            <p class="subtitle">Ingresa tu código para acceder al panel de navegación</p>
            
            <div class="input-group">
                <label><i class="fas fa-key"></i> Código de cliente</label>
                <input type="text" id="codigoInput" placeholder="Ej: AD507-0001" autofocus>
            </div>
            
            <button class="btn" onclick="buscarCliente()">
                <i class="fas fa-search"></i> Buscar dirección
            </button>
            
            <div class="result" id="resultado">
                <p id="mensajeResultado"></p>
                <a href="#" id="panelLink" target="_blank" style="display: block; margin-top: 15px; color: #1a2f6a; font-weight: 600;">→ Abrir panel completo</a>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-map-marked-alt" style="color:#1a73e8;"></i>
                    <span>Google Maps</span>
                </div>
                <div class="feature">
                    <i class="fab fa-waze" style="color:#33ccff;"></i>
                    <span>Waze</span>
                </div>
                <div class="feature">
                    <i class="fab fa-uber" style="color:#000;"></i>
                    <span>Uber</span>
                </div>
                <div class="feature">
                    <i class="fab fa-whatsapp" style="color:#25d366;"></i>
                    <span>WhatsApp</span>
                </div>
            </div>
        </div>
        <div class="footer">
            AD507 Panamá • Sistema de direcciones
        </div>
    </div>

    <script>
        // Base de datos local de ejemplo (después se conecta al JSON)
        const clientesDB = {
            "AD507-0001": {
                nombre: "Juan Pérez",
                telefono: "63564932",
                referencia: "Frente al supermercado",
                coordenadas: "9.006347, -79.504055"
            },
            "AD507-0002": {
                nombre: "María González",
                telefono: "61234567",
                referencia: "Casa verde portón blanco",
                coordenadas: "9.006590, -79.504045"
            }
        };

        function buscarCliente() {
            const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
            const resultado = document.getElementById('resultado');
            const mensaje = document.getElementById('mensajeResultado');
            const link = document.getElementById('panelLink');
            
            const cliente = clientesDB[codigo];
            
            if (cliente) {
                const [lat, lng] = cliente.coordenadas.split(',').map(c => c.trim());
                const panelUrl = `panel.html?codigo=${codigo}&nombre=${encodeURIComponent(cliente.nombre)}&telefono=${cliente.telefono}&referencia=${encodeURIComponent(cliente.referencia)}&lat=${lat}&lng=${lng}`;
                
                mensaje.innerHTML = `<i class="fas fa-check-circle" style="color:green;"></i> Cliente encontrado: <strong>${cliente.nombre}</strong>`;
                link.href = panelUrl;
                resultado.classList.add('show');
            } else {
                mensaje.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#f39c12;"></i> Código "${codigo}" no encontrado.`;
                link.href = '#';
                resultado.classList.add('show');
            }
        }

        document.getElementById('codigoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarCliente();
        });
    </script>
</body>
</html>
