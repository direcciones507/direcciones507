<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Direcciones507 · Sistema Digital de Direcciones Panamá</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

<style>
/* 👉 NO CAMBIÉ TU DISEÑO */
body{margin:0;font-family:Inter;background:#0b1020;color:#fff}
.container{max-width:980px;margin:auto;padding:20px}
.hidden{display:none!important}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;text-decoration:none;font-weight:700}
.primary{background:#22c55e;color:#000}
.secondary{background:#3b82f6;color:#fff}
.whats{background:#16a34a;color:#fff}
.card{background:#111827;padding:16px;border-radius:18px;margin-top:18px}
input{padding:14px;border-radius:12px;border:none;width:100%}
</style>
</head>

<body>
<div class="container">

<h2>Direcciones507</h2>

<div>
<input id="inputCodigo" placeholder="Ingresa tu código AD507"
onkeydown="if(event.key==='Enter'){buscarCodigo()}">
<button onclick="buscarCodigo()">Buscar</button>
</div>

<!-- BLOQUE CLIENTE -->
<div id="clienteBlock" class="hidden">

<div class="card">
<h3 id="uiNombre"></h3>
<p id="uiRef"></p>

<div style="display:grid;gap:10px">

<a id="btnGoogle" class="btn primary" target="_blank">
<i class="fa-brands fa-google"></i> Google Maps
</a>

<a id="btnWaze" class="btn primary" target="_blank">
<i class="fa-brands fa-waze"></i> Waze
</a>

<a id="btnUber" class="btn secondary" target="_blank">
<i class="fa-brands fa-uber"></i> Uber
</a>

<a id="btnAviso" class="btn whats" target="_blank">
<i class="fa-brands fa-whatsapp"></i> Aviso de llegada
</a>

</div>

<br>

<a id="linkVerificacion" target="_blank">
Ver enlace de verificación
</a>

</div>

<div class="card">
<h4>QR Compartir</h4>
<img id="qrImg" width="220">
</div>

<div id="statsBlock" class="card hidden">
<h4>Actividad</h4>
<div>Google: <span id="stGoogle">0</span></div>
<div>Waze: <span id="stWaze">0</span></div>
<div>Uber: <span id="stUber">0</span></div>
<div>Compartir: <span id="stShare">0</span></div>
<div>Copiar: <span id="stCopy">0</span></div>
</div>

</div>

<!-- PANEL PRINCIPAL -->
<div id="principalBlock">

<div class="card">
<h3>Pasos</h3>
<p>Comparte tu enlace y el cliente elige su app.</p>
</div>

<div class="card">
<h3>Precios</h3>
<p>Personal $6.99</p>
<p>Negocios $10.99</p>
</div>

</div>

<br>

<div>
<a href="https://www.instagram.com/direccionesdigitalespty" target="_blank">Instagram</a>
<br>
<a href="https://www.facebook.com/profile.php?id=61587079091033" target="_blank">Facebook</a>
<br>
<a href="https://www.tiktok.com/@direcciones507" target="_blank">TikTok</a>
<br>
<a href="https://wa.me/50765996532" target="_blank">WhatsApp</a>
</div>

</div>

<script>

const WEBAPP_URL="https://script.google.com/macros/s/AKfycbwbqdHm2SUOmJPNWNI2e555hQqupzRIpxml3ZPZhadNDfZeFrJrkD4UEXzqXtstYcUXWA/exec";

function normalizeUrl(u){
if(!u||u==="#")return"#";
if(/^https?:\/\//i.test(u))return u;
return "https://"+u;
}

async function buscarCodigo(){

let code=document.getElementById("inputCodigo").value.trim();
if(!code)return;

let res=await fetch(`${WEBAPP_URL}?code=${code}`);
let data=await res.json();
if(!data.ok)return;

document.getElementById("principalBlock").classList.add("hidden");
document.getElementById("clienteBlock").classList.remove("hidden");

document.getElementById("uiNombre").innerText=data.nombre;
document.getElementById("uiRef").innerText=data.referencia;

document.getElementById("btnGoogle").href=normalizeUrl(data.google);
document.getElementById("btnWaze").href=normalizeUrl(data.waze);
document.getElementById("btnUber").href=normalizeUrl(data.uber);
document.getElementById("btnAviso").href=normalizeUrl(data.whatsapp);

document.getElementById("linkVerificacion").href=normalizeUrl(data.google);

let linkCliente=`${location.origin}${location.pathname}?code=${code}`;
document.getElementById("qrImg").src=
`https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(linkCliente)}`;

let esNegocio=(data.plan||"").toLowerCase().includes("negocio");

if(esNegocio){
document.getElementById("statsBlock").classList.remove("hidden");
cargarStats(code);
}

}

async function cargarStats(code){
let r=await fetch(`${WEBAPP_URL}?action=stats&code=${code}`);
let d=await r.json();
if(!d.ok||!d.stats)return;
document.getElementById("stGoogle").innerText=d.stats.google;
document.getElementById("stWaze").innerText=d.stats.waze;
document.getElementById("stUber").innerText=d.stats.uber;
document.getElementById("stShare").innerText=d.stats.share;
document.getElementById("stCopy").innerText=d.stats.copy;
}

(function(){
let qs=new URLSearchParams(location.search);
let code=qs.get("code");
if(code){
document.getElementById("inputCodigo").value=code;
buscarCodigo();
}
})();

</script>
</body>
</html>
