<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD507 Panamá</title>

<style>
body{
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}
.card{
background:white;
color:black;
max-width:500px;
margin:auto;
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
input{
width:90%;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
font-size:18px;
text-align:center;
}
button{
margin-top:15px;
padding:15px 25px;
border:none;
border-radius:12px;
background:black;
color:white;
font-size:18px;
cursor:pointer;
}
.links a{
display:block;
margin:10px;
padding:14px;
background:#111827;
color:white;
border-radius:12px;
text-decoration:none;
font-size:16px;
}
</style>
</head>

<body>

<h1>AD507 Panamá</h1>
<p>Ingresa tu código para ver tu dirección digital</p>

<div class="card">

<input id="codigo" placeholder="Ej: AD507-0001">
<br>
<button onclick="buscar()">Buscar</button>

<div id="estado" style="margin-top:10px;"></div>
<div id="resultado" style="margin-top:20px;"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwopyb0Cp5V2QyBUhmmOjkp1j9884W0RTy9068GjJYpPShKw95b4JllidryNfUPuaiAPg/exec";

async function buscar(){

const codigo = document.getElementById("codigo").value.trim();
if(!codigo){alert("Escribe el código");return;}

document.getElementById("estado").innerHTML="Buscando...";

const res = await fetch(API_URL+"?code="+codigo);
const data = await res.json();

if(!data.ok){
document.getElementById("estado").innerHTML="Código no encontrado";
return;
}

document.getElementById("estado").innerHTML="Listo ✓";

const linkCliente = `${location.origin}${location.pathname}?code=${codigo}`;

document.getElementById("resultado").innerHTML=`

<h3>${codigo}</h3>

<div class="links">
<a href="${data.google_maps}" target="_blank">📍 Google Maps</a>
<a href="${data.waze}" target="_blank">🚗 Waze</a>
<a href="${data.uber}" target="_blank">🚕 Uber</a>
<a href="${data.link_whatsapp}" target="_blank">💬 Avisar llegada</a>
</div>

<div style="margin-top:20px;background:#f1f5f9;padding:15px;border-radius:12px;color:black;">

<b>LINK DEL CLIENTE</b>

<input id="linkCliente" value="${linkCliente}" readonly
style="width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ccc;text-align:center;">

<button onclick="copiarLink()" 
style="width:100%;margin-top:10px;padding:14px;background:black;color:white;border:none;border-radius:10px;">
📋 COPIAR LINK CLIENTE
</button>

<a href="https://wa.me/?text=${encodeURIComponent("Hola 👋 Tu Dirección Digital ya está activa:\n"+linkCliente)}" target="_blank"
style="display:block;margin-top:10px;padding:14px;background:#16a34a;color:white;border-radius:10px;text-decoration:none;">
📲 ENVIAR POR WHATSAPP
</a>

</div>

<div style="display:flex;justify-content:center;gap:20px;margin-top:20px;">
<div>
<div>QR Maps</div>
<img src="${data.qr_maps}" width="150">
</div>
<div>
<div>QR WhatsApp</div>
<img src="${data.qr_whatsapp}" width="150">
</div>
</div>
`;
}

function copiarLink(){
var copyText=document.getElementById("linkCliente");
copyText.select();
document.execCommand("copy");
alert("Link copiado para enviar al cliente");
}

// abrir directo si viene ?code=
const params=new URLSearchParams(window.location.search);
const code=params.get("code");
if(code){
document.getElementById("codigo").value=code;
buscar();
}

</script>

</body>
</html>
