<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direcciones507</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:40px;
}
.card{
  background:white;
  color:black;
  max-width:500px;
  margin:auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
input{
  width:90%;
  padding:15px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:18px;
  text-align:center;
}
button{
  margin-top:15px;
  padding:15px 25px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  font-size:18px;
  cursor:pointer;
}
.links a{
  display:block;
  margin:10px;
  padding:12px;
  background:black;
  color:white;
  border-radius:10px;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>AD507 Panamá</h1>
<p>Busca tu dirección digital</p>

<div class="card">
<input id="codigo" placeholder="Ej: AD507-001">
<br>
<button onclick="buscar()">Buscar</button>

<div id="resultado" style="margin-top:20px;"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzCKF1rrBeAbJ3L9SGUgN8rhSMcWPl_LNM_iZaPcbgWHhVH5N_ocqL2LHCLUr2jk6d06A/exec";

async function buscar(){
  const codigo = document.getElementById("codigo").value.trim();
  if(!codigo){ alert("Escribe tu código"); return; }

  const res = await fetch(API_URL + "?code=" + codigo);
  const data = await res.json();

  if(!data.ok){
    document.getElementById("resultado").innerHTML = "Código no encontrado";
    return;
  }

  document.getElementById("resultado").innerHTML = `
    <h3>${data.nombre || ""}</h3>

    <div class="links">
      <a href="${data.google_maps}" target="_blank">📍 Google Maps</a>
      <a href="${data.waze}" target="_blank">🚗 Waze</a>
      <a href="${data.uber}" target="_blank">🚕 Uber</a>
      <a href="${data.link_whatsapp}" target="_blank">💬 Avisar llegada</a>
    </div>
  `;
}

</script>

</body>
</html>
