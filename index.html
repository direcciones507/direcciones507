<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direcciones507 · Sistema Digital de Direcciones Panamá</title>
  <!-- Font Awesome 6 (iconos profesionales) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Inter y Outfit para aspecto moderno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET Y VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0c12;
      --bg-secondary: #11131f;
      --bg-card: #181b28;
      --bg-input: #22263b;
      --accent-green: #16c47f;
      --accent-blue: #2d7aff;
      --accent-waze: #3b82f6;
      --accent-uber: #000000;
      --accent-whats: #25D366;
      --text-primary: #ffffff;
      --text-secondary: #a8b3cf;
      --border-dim: rgba(255,255,255,0.08);
      --glow: 0 8px 20px rgba(0,0,0,0.6);
    }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    /* ===== HEADER PROFESIONAL ===== */
    .top-bar {
      background: var(--bg-secondary);
      padding: 20px 0;
      border-bottom: 1px solid var(--border-dim);
      backdrop-filter: blur(5px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-main {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #bdd3ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo-badge {
      background: rgba(45, 122, 255, 0.15);
      color: var(--accent-blue);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(45, 122, 255, 0.3);
      margin-top: 5px;
    }

    /* ===== BOTON SOLICITAR ===== */
    .cta-section {
      text-align: center;
      margin: 25px 0 15px;
    }

    .btn-solicitar {
      background: linear-gradient(145deg, #1fbf64, #16a34a);
      color: white;
      border: none;
      padding: 18px 34px;
      border-radius: 60px;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 20px -5px rgba(22, 163, 74, 0.4);
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
      letter-spacing: -0.2px;
    }

    .btn-solicitar i {
      font-size: 1.8rem;
    }

    .btn-solicitar:hover {
      transform: scale(1.02);
      background: linear-gradient(145deg, #22c55e, #15803d);
      box-shadow: 0 15px 25px -5px #14532d80;
    }

    /* ===== TARJETA PRINCIPAL (INPUT) ===== */
    .search-card {
      background: var(--bg-card);
      border-radius: 32px;
      padding: 35px 28px;
      box-shadow: var(--glow);
      border: 1px solid rgba(255,255,255,0.05);
      margin: 20px 0;
      backdrop-filter: blur(10px);
    }

    .search-label {
      display: block;
      text-align: center;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 15px;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group input {
      flex: 1;
      min-width: 200px;
      background: var(--bg-input);
      border: 2px solid transparent;
      padding: 18px 22px;
      border-radius: 60px;
      font-size: 1.1rem;
      color: white;
      font-weight: 500;
      text-align: center;
      transition: 0.15s;
      border: 2px solid rgba(255,255,255,0.05);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-blue);
      background: #1f2542;
    }

    .input-group button {
      background: white;
      border: none;
      border-radius: 60px;
      padding: 0 32px;
      font-weight: 700;
      font-size: 1rem;
      color: #0a0c12;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      border: 2px solid transparent;
    }

    .input-group button i {
      font-size: 1.2rem;
    }

    .input-group button:hover {
      background: #e0e7ff;
      transform: scale(1.02);
    }

    /* ===== RESULTADOS ===== */
    .result-container {
      margin-top: 30px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 25px 0;
    }

    .map-link {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,0.05);
      padding: 18px 22px;
      border-radius: 20px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.15s;
      backdrop-filter: blur(5px);
    }

    .map-link i {
      font-size: 1.8rem;
      width: 32px;
      text-align: center;
    }

    .map-link:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(5px);
      border-color: rgba(255,255,255,0.2);
    }

    .map-link.maps { background: rgba(22, 163, 74, 0.15); border-left: 5px solid #16a34a; }
    .map-link.waze { background: rgba(59, 130, 246, 0.15); border-left: 5px solid #3b82f6; }
    .map-link.uber { background: rgba(0, 0, 0, 0.4); border-left: 5px solid #555; }
    .map-link.whats { background: rgba(37, 211, 102, 0.15); border-left: 5px solid #25D366; }

    /* cajas de informacion */
    .info-box {
      background: rgba(10, 15, 30, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 22px;
      margin: 24px 0;
    }

    .info-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #8b9bb9;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-content {
      background: #0c0f1a;
      padding: 18px;
      border-radius: 18px;
      font-family: monospace;
      word-break: break-all;
      color: #b9c8f0;
      border: 1px solid #252b40;
      margin: 15px 0;
      font-size: 0.95rem;
    }

    .btn-copy {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 60px;
      padding: 14px 22px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: 0.15s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-copy:hover {
      background: #1a4fbb;
    }

    .btn-whatsapp-share {
      background: #25D366;
      color: #111;
      font-weight: 700;
      padding: 16px;
      border-radius: 60px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .qr-box {
      text-align: center;
      background: #0f1322;
      border-radius: 28px;
      padding: 28px;
      margin: 25px 0;
    }

    .qr-box img {
      background: white;
      padding: 10px;
      border-radius: 24px;
      max-width: 180px;
      margin: 15px auto;
    }

    /* ===== FOOTER REDISEÑADO ===== */
    .footer {
      margin-top: 60px;
      background: #070a13;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 40px 20px 25px;
    }

    .footer-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 25px;
    }

    .social-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .social-links a {
      color: #a0afcf;
      background: #181e30;
      width: 48px;
      height: 48px;
      border-radius: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: 0.15s;
      border: 1px solid #2d3555;
    }

    .social-links a:hover {
      background: var(--accent-blue);
      color: white;
      transform: translateY(-3px);
    }

    .footer-copy {
      color: #5b6a8c;
      font-size: 0.9rem;
      border-top: 1px solid #1e253a;
      padding-top: 25px;
      margin-top: 15px;
      width: 100%;
    }

    /* ocultar cta en pagina de cliente (logica intacta) */
    .hidden-cta { display: none !important; }

    /* responsive */
    @media (max-width: 500px) {
      .input-group { flex-direction: column; }
      .input-group button { padding: 18px; }
      .logo-main { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER PROFESIONAL (siempre visible) -->
  <div class="top-bar">
    <div class="container logo-area">
      <div class="logo-main">DIRECCIONES507</div>
      <span class="logo-badge"><i class="fas fa-map-pin"></i> Sistema Digital Panamá</span>
    </div>
  </div>

  <!-- BOTON SOLICITAR (se oculta automaticamente en pagina de cliente) -->
  <div id="ctaSolicitar" class="container cta-section">
    <a href="https://wa.me/50765996532?text=Hola,%20quiero%20mi%20dirección%20digital%20Direcciones507" class="btn-solicitar">
      <i class="fab fa-whatsapp"></i> SOLICITAR MI DIRECCIÓN DIGITAL
    </a>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="container">
    <!-- TARJETA DE BUSQUEDA -->
    <div class="search-card">
      <span class="search-label"><i class="fas fa-qrcode"></i> Ingresa tu código AD507</span>
      <div class="input-group">
        <input type="text" id="codigo" placeholder="Ej: AD507-12345" autocomplete="off">
        <button onclick="buscar()"><i class="fas fa-search"></i> Buscar</button>
      </div>

      <!-- AQUI SE INYECTA EL RESULTADO -->
      <div id="resultado" class="result-container"></div>
    </div>
  </div>

  <!-- FOOTER MEJORADO -->
  <footer class="footer">
    <div class="footer-content">
      <div style="font-weight: 600; color: white;">Direcciones507 · Panamá 🇵🇦</div>
      
      <div class="social-links">
        <a href="https://www.instagram.com/direccionesdigitalespty" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/profile.php?id=61587079091033" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.tiktok.com/@direcciones507" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://wa.me/50765996532" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      </div>

      <div class="footer-copy">
        © 2026 Direcciones Digitales Panamá. Todos los derechos reservados.<br>
        <span style="opacity: 0.5; font-size: 0.8rem;">Prohibida la copia o reproducción del sistema sin autorización.</span>
      </div>
    </div>
  </footer>

  <!-- SCRIPT (LOGICA ORIGINAL INTACTA - solo ajustes minimos de estilo) -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwopyb0Cp5V2QyBUhmmOjkp1j9884W0RTy9068GjJYpPShKw95b4JllidryNfUPuaiAPg/exec";

    async function buscar() {
      let codigo = document.getElementById("codigo").value.trim();
      if (!codigo) { alert("Ingresa un código válido"); return; }

      const res = await fetch(API_URL + "?code=" + codigo);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById("resultado").innerHTML = `
          <div style="background:#2a1a1a; border-radius:20px; padding:20px; color:#ff8a8a; border:1px solid #ff4d4d;">
            <i class="fas fa-exclamation-triangle"></i> Código no encontrado
          </div>`;
        return;
      }

      const linkCliente = location.origin + "/" + codigo;
      const qrCliente = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(linkCliente);
      const linkVerificacion = data.qr_maps; 

      // Generamos el HTML con los nuevos estilos pero misma funcionalidad
      document.getElementById("resultado").innerHTML = `
        <!-- LINKS DE NAVEGACION -->
        <div class="links-grid">
          <a class="map-link maps" href="${data.google_maps}" target="_blank"><i class="fab fa-google"></i> Google Maps</a>
          <a class="map-link waze" href="${data.waze}" target="_blank"><i class="fab fa-waze"></i> Waze</a>
          <a class="map-link uber" href="${data.uber}" target="_blank"><i class="fab fa-uber"></i> Uber</a>
          <a class="map-link whats" href="${data.link_whatsapp}" target="_blank"><i class="fab fa-whatsapp"></i> Avisar llegada</a>
        </div>

        <!-- LINK VERIFICACION IMPRIMIR -->
        <div class="info-box">
          <div class="info-title"><i class="fas fa-print"></i> LINK DE VERIFICACIÓN PARA IMPRIMIR</div>
          <div class="info-content">${linkVerificacion}</div>
          <button class="btn-copy" onclick="copiar('${linkVerificacion}')"><i class="fas fa-copy"></i> Copiar enlace de verificación</button>
        </div>

        <!-- LINK CLIENTE -->
        <div class="info-box">
          <div class="info-title"><i class="fas fa-user"></i> LINK DEL CLIENTE</div>
          <div class="info-content">${linkCliente}</div>
          <button class="btn-copy" onclick="copiar('${linkCliente}')"><i class="fas fa-copy"></i> Copiar link cliente</button>
          
          <a class="btn-whatsapp-share" href="https://wa.me/?text=Tu dirección digital:%20${linkCliente}" target="_blank">
            <i class="fab fa-whatsapp"></i> Enviar por WhatsApp
          </a>
        </div>

        <!-- QR -->
        <div class="qr-box">
          <div class="info-title" style="justify-content: center;"><i class="fas fa-qrcode"></i> CÓDIGO QR</div>
          <img src="${qrCliente}" alt="QR de dirección">
        </div>
      `;
    }

    function copiar(t) {
      navigator.clipboard.writeText(t);
      alert("✅ Copiado al portapapeles");
    }

    // AUTO EJECUTAR SI HAY CODE EN URL
    (function() {
      const params = new URLSearchParams(window.location.search);
      const c = params.get("code");
      if (c) {
        document.getElementById("codigo").value = c;
        buscar();
      }

      // OCULTAR BOTON SOLICITAR EN PAGINA DE CLIENTE (ruta AD507)
      const cta = document.getElementById("ctaSolicitar");
      const path = window.location.pathname.split("/").filter(Boolean).pop();
      if ((c && c.startsWith("AD507")) || (path && path.startsWith("AD507"))) {
        if (cta) cta.classList.add("hidden-cta");
      }
    })();
  </script>

  <!-- Pequeño ajuste: si el script no oculta, forzamos por si acaso -->
  <style>
    .hidden-cta { display: none !important; }
  </style>
</body>
</html>
