<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación AD507</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:#111827;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:420px;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}
h1{margin:0 0 10px 0}
.qr{
  margin-top:20px;
}
img{
  width:260px;
  background:white;
  padding:10px;
  border-radius:12px;
}
.small{
  margin-top:15px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="card">
  <h1>Direcciones507</h1>
  <div id="codigo"></div>

  <div class="qr">
    <img id="qrImg" src="">
  </div>

  <div class="small">
    Este código es válido para verificación e impresión.
  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz3R8RZe6-g9_oeLc7c6gjSguElG1jVdwxu8mnqVWffO9nU9c1ZwacUXlxVCXwCsLNhWQ/exec";

const params = new URLSearchParams(location.search);
const code = params.get("code");

if(code){
  document.getElementById("codigo").innerHTML = "Código: <b>"+code+"</b>";

  fetch(`${WEBAPP_URL}?code=${code}`)
    .then(r=>r.json())
    .then(data=>{
      if(data.qr_maps){
        document.getElementById("qrImg").src = data.qr_maps;
      }
    });
}
</script>

</body>
</html>
